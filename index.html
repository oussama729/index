<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pour toi ❤</title>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f9d6d2; --ink:#4a1226; --heart:#e0334c; --soft:#7a3148;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#2a0b17; --ink:#ffe3df; --heart:#ff5a72; --soft:#e8a9b4;}
}
:root[data-theme="dark"]{--bg:#2a0b17; --ink:#ffe3df; --heart:#ff5a72; --soft:#e8a9b4;}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;text-align:center;font-family:"Caveat",cursive;overflow:hidden}
main{padding:24px;max-width:520px}
button{all:unset;cursor:pointer;display:block;margin:0 auto}
button:focus-visible{outline:3px solid var(--ink);outline-offset:8px;border-radius:50%}
svg{width:min(52vw,230px);height:auto;fill:var(--heart);animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,60%,100%{transform:scale(1)}15%{transform:scale(1.12)}30%{transform:scale(.97)}45%{transform:scale(1.07)}}
.hint{font-size:1.6rem;color:var(--soft);margin-top:20px;transition:opacity .4s}
.msg{opacity:0;transform:translateY(10px);transition:opacity .9s,transform .9s;pointer-events:none;height:0;overflow:hidden}
.open .msg{opacity:1;transform:none;height:auto;margin-top:18px}
.open .hint{opacity:0;height:0;margin:0}
.open svg{animation-duration:1.1s}
h1{font-family:"Gloock",Georgia,serif;font-weight:400;font-size:clamp(2.6rem,11vw,4.2rem);margin:0;line-height:1.05}
.en{font-size:2rem;color:var(--soft);margin:6px 0 0}
p.note{font-size:1.7rem;line-height:1.35;margin:22px auto 0;max-width:30ch}
.fly{position:fixed;bottom:-30px;font-size:1.6rem;animation:up 3.2s ease-in forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-110vh) rotate(20deg);opacity:0}}
@media (prefers-reduced-motion:reduce){svg,.fly{animation:none}.msg{transition:none}}
</style>
</head>
<body>
<main id="m">
  <button id="b" aria-label="Touche le cœur">
    <svg viewBox="0 0 32 29" aria-hidden="true"><path d="M23.6 0c-3 0-5.6 1.5-7.6 4.2C14 1.5 11.400 0 8.400 0 3.600 0 0 3.800 0 8.600c0 7.100 8.600 12.700 14.600 19.400.7.800 2.100.8 2.800 0C23.400 21.300 32 15.700 32 8.600 32 3.800 28.400 0 23.600 0z"/></svg>
  </button>
  <div class="hint">touche le cœur</div>
  <div class="msg" aria-live="polite">
    <h1>Je t’aime</h1>
    <div class="en">I love you</div>
    <p class="note">Merci d’être là, d’être toi, et de faire de chaque jour un peu plus beau. ❤<br>Thank you for being you.</p>
  </div>
</main>
<script>
const m=document.getElementById('m');
document.getElementById('b').addEventListener('click',()=>{
  m.classList.add('open');
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  for(let i=0;i<18;i++){
    const h=document.createElement('span');
    h.className='fly';h.textContent=['❤','💗','💖'][i%3];
    h.style.left=Math.random()*95+'vw';
    h.style.animationDelay=(Math.random()*1.2)+'s';
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),5000);
  }
});
</script>
</body>
</html>
